  <body>

         depende de la app. En cualquier otra ruta se elimina justo debajo. -->

        <div class="absolute inset-0" aria-hidden="true">
          <div class="relative h-full w-full overflow-hidden bg-night-800" id="hero-foto">

                 de debajo: queda esta, de un solo formato. -->

                src="/photos/gen/hero-interior-960.webp"

    <!-- La foto del hero vive en una plantilla: los navegadores no descargan
         nada de lo que hay dentro de <template>, así que solo se pide en la
         portada. El guion de debajo la inserta (o se lleva la plantilla si la
         ruta no es la portada). -->
    <template id="hero-foto-src">
      <picture>
        <source
          media="(max-width: 1023px)"
          type="image/avif"
          sizes="100vw"
          srcset="/photos/gen/galeria-03-640.avif 640w, /photos/gen/galeria-03-960.avif 960w, /photos/gen/galeria-03-1179.avif 1179w"
        />
        <source
          media="(max-width: 1023px)"
          type="image/webp"
          sizes="100vw"
          srcset="/photos/gen/galeria-03-640.webp 640w, /photos/gen/galeria-03-960.webp 960w, /photos/gen/galeria-03-1179.webp 1179w"
        />
        <source
          type="image/avif"
          sizes="100vw"
          srcset="/photos/gen/hero-interior-640.avif 640w, /photos/gen/hero-interior-960.avif 960w, /photos/gen/hero-interior-1179.avif 1179w"
        />
        <source
          type="image/webp"
          sizes="100vw"
          srcset="/photos/gen/hero-interior-640.webp 640w, /photos/gen/hero-interior-960.webp 960w, /photos/gen/hero-interior-1179.webp 1179w"
        />
        <img
          src="/photos/gen/hero-interior-1179.jpg"
          srcset="/photos/gen/hero-interior-640.jpg 640w, /photos/gen/hero-interior-960.jpg 960w, /photos/gen/hero-interior-1179.jpg 1179w"
          sizes="100vw"
          width="1179"
          height="874"
          alt=""
          loading="eager"
          decoding="async"
          class="absolute inset-0 h-full w-full object-cover"
          style="object-position: center 72%"
        />
      </picture>
    </template>

    <div id="root"></div>

    <script>
      // Solo la portada tiene arranque estático: en cualquier otra ruta se
      // elimina antes de pintar y React monta sobre #root vacío.
      var plantilla = document.getElementById('hero-foto-src')
      if (location.pathname === '/') {
        window.__heroEstatico = true
        document
          .getElementById('hero-foto')
          .appendChild(plantilla.content.cloneNode(true))
      } else {
        document.getElementById('hero-estatico').remove()
      }
      plantilla.remove()
    </script>

    <!-- Sin JavaScript la app no puede montarse: al menos no dejamos la página
         en blanco. Datos copiados de src/data/site.ts (teléfono, horario,
         dirección). -->

          color: #f5efe3;
          font-family: system-ui, -apple-system, sans-serif;
          line-height: 1.6;
          padding: 32px 24px;
          text-align: center;
        "
      >

        <p style="margin: 0">

          <a href="tel:+34666055526" style="color: #e5cf9c">666 05 55 26</a>
